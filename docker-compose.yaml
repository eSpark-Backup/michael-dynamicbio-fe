services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: "https://app.h2fusion.org/api"
        VITE_BASE_URL_FE: "https://app.h2fusion.org"
    container_name: dydnamicbio
    restart: unless-stopped
    ports:
      - "5000:3000"
    environment:
      - NODE_ENV=production